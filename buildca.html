<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f2fa;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        h1 {
            color: #283477;
            background-color: #2539d8;
        }

        .courses {
            display: flex;
            justify-content: center;
            width: 15px;

        }

        .course {
            background-color: #f6cbd4;
            width: 250px;
            padding: 30px 20px;
            border: 1px solid #555;
            border-radius: 10px;
            
        }

        .course h2 {
            color: #732877;
            margin-top: 0;
        }

        .course p {
            color: #555;
            background-color: #f6cbd4;
        }

        button {
            background-color: #2539d8;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 5px;
            
            font-size: 15px;
        }

        footer {
            margin-top: 35px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>MY COURSES</h1>

    <div class="courses">

        <div class="course">
            <h2>HTML</h2>
            <p>
                Learn the basics of HTML and
                create your first webpage.
            </p>
            <button>Start Course</button>
        </div>

        <div class="course">
            <h2>CSS</h2>
            <p>
                Learn colors, fonts, borders and
                beautiful webpage styling.
            </p>
            <button>Start Course</button>
        </div>

        <div class="course">
            <h2>JavaScript</h2>
            <p>
                Learn JavaScript and make your
                webpages interactive.
            </p>
            <button>Start Course</button>
        </div>

    </div>

    

</body>
</html>
