<!DOCTYPE html>
<html>
<head>
    <title>MY COURSES</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        h1 {
            color: rgb(255, 0, 234);
            margin-bottom: 45px;
        }
        
        .courses{
            display: flex;
            
            justify-content: center;
            gap: 20px;
        }
        

      
        

       
        .course {
            background-color: aliceblue;
            width: 250px;
            padding: 30px,20px;

            border-radius: 10px;
            border: 2px solid black;
            box-sizing: border-box;
        }

        .course h2 {
            color: black;
            font-size: 20px;
        }

        .course p {
            color: black;
        }

        button {
            padding: 10px 25px;
        }
    </style>
</head>

<body>

    <h1>MY COURSES</h1>

    <div class="courses">

        <div class="course">
            <h2>HTML</h2>
            <p>
                Learn the basics of HTML and
                create your first webpage.
            </p>
            <button>Start Course</button>
        </div>

        <div class="course">
            <h2>CSS</h2>
            <p>
                Learn colors, fonts, borders and
                beautiful webpage styling.
            </p>
            <button>Start Course</button>
        </div>

        <div class="course">
            <h2>JavaScript</h2>
            <p>
                Learn JavaScript and make your
                webpages interactive.
            </p>
            <button>Start Course</button>
        </div>

    </div>

</body>
</html>
