<!DOCTYPE html>
<html>
<head>
    <style>
        .block {
            display: block;
            width: 200px;
            background-color: white;
            margin: 5px;
        }

        .inline {
            display: inline;
            background-color: blue;
        }

        .inline-block {
            display: inline-block;
            width: 150px;
            height: 50px;
            background-color: lightpink;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>1. block</h1>

    <div class="inline-box">box 1</div>
    <div class="inline ">box 2</div>
    <div class="inline-box">box 3</div>

</body>
</html>
