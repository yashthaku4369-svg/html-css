<!DOCTYPE html>
<html>

<head>
    <title>Text Styling Properties</title>

    <style>
        .align {
            text-align: center;
        }

        .decoration {
            text-decoration: underline;
        }

        .transform {
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <h1>Text Styling Properties</h1>

    <p class="align">This text is centered.</p>

    <p class="decoration">This text is underlined.</p>

    <p class="transform">this text will become uppercase.</p>

</body>

</html>
