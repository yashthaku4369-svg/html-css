<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #212121;
    --sidebar: #171717;
    --panel: #2f2f2f;
    --hover: #2a2a2a;
    --text: #ececec;
    --muted: #9b9b9b;
    --border: #3a3a3a;
    --accent: #10a37f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 10px;
    flex-shrink: 0;
    transition: margin-left .2s;
  }
  .new-chat {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: none; border: none; color: var(--text);
    font-size: 14px; cursor: pointer; width: 100%; text-align: left;
  }
  .new-chat:hover, .history a:hover { background: var(--hover); }
  .history { flex: 1; overflow-y: auto; margin-top: 16px; }
  .history h4 { font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 12px; }
  .history a {
    display: block; padding: 9px 12px; border-radius: 8px;
    color: var(--text); text-decoration: none; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  .profile:hover { background: var(--hover); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #5436da; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
  }
  .menu-btn {
    display: none; background: none; border: none; color: var(--text);
    font-size: 22px; cursor: pointer;
  }
  .model { font-size: 18px; font-weight: 600; color: var(--muted); }

  .messages { flex: 1; overflow-y: auto; padding: 0 16px; }
  .thread { max-width: 760px; margin: 0 auto; padding: 16px 0 32px; }

  .empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 500;
  }

  .msg { display: flex; gap: 14px; margin-bottom: 28px; line-height: 1.65; font-size: 16px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--panel); padding: 10px 18px; border-radius: 22px;
    max-width: 75%; white-space: pre-wrap;
  }
  .msg.bot .icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--border); display: grid; place-items: center;
    color: var(--accent); font-size: 14px; margin-top: 2px;
  }
  .msg.bot .bubble { white-space: pre-wrap; }

  /* Composer */
  .composer-wrap { padding: 0 16px 12px; }
  .composer {
    max-width: 760px; margin: 0 auto;
    background: var(--panel); border-radius: 26px;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 10px 10px 20px;
  }
  .composer textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font: inherit; font-size: 16px; line-height: 1.5;
    max-height: 200px; padding: 6px 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: #fff; color: #000; cursor: pointer; font-size: 18px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .send:disabled { background: #555; color: #999; cursor: default; }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding-top: 10px; }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; margin-left: -260px; }
    .sidebar.open { margin-left: 0; }
    .menu-btn { display: block; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="new-chat" id="newChat">✎ New chat</button>
  <nav class="history">
    <h4>Today</h4>
    <a href="#">Plan a trip to Goa</a>
    <a href="#">Explain async/await</a>
    <h4>Previous 7 days</h4>
    <a href="#">Resume feedback</a>
    <a href="#">Python list comprehension</a>
    <a href="#">Healthy dinner ideas</a>
  </nav>
  <div class="profile"><div class="avatar">U</div> Your name</div>
</aside>

<main>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <span class="model">Chat ▾</span>
  </header>

  <div class="messages" id="messages">
    <div class="thread" id="thread">
      <div class="empty" id="empty">What can I help with?</div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message..."></textarea>
      <button class="send" id="send" disabled aria-label="Send">↑</button>
    </div>
    <p class="note">AI can make mistakes. Check important info.</p>
  </div>
</main>

<script>
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const thread = document.getElementById('thread');
  const messages = document.getElementById('messages');
  const sidebar = document.getElementById('sidebar');

  function addMessage(role, text) {
    const empty = document.getElementById('empty');
    if (empty) empty.remove();
    thread.style.height = 'auto';
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    if (role === 'bot') {
      el.innerHTML = '<div class="icon">✦</div><div class="bubble"></div>';
      el.querySelector('.bubble').textContent = text;
    } else {
      el.innerHTML = '<div class="bubble"></div>';
      el.querySelector('.bubble').textContent = text;
    }
    thread.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function submit() {
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    send.disabled = true;

    // Placeholder reply: replace this with a call to your own backend/API
    const bot = addMessage('bot', '…');
    setTimeout(() => {
      bot.querySelector('.bubble').textContent = 'This is a demo reply. Connect me to your API to get real answers.';
      messages.scrollTop = messages.scrollHeight;
    }, 700);
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
    send.disabled = !input.value.trim();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  send.addEventListener('click', submit);

  document.getElementById('newChat').addEventListener('click', () => {
    thread.innerHTML = '<div class="empty" id="empty">What can I help with?</div>';
    sidebar.classList.remove('open');
  });
  document.getElementById('menuBtn').addEventListener('click', () => sidebar.classList.toggle('open'));
  messages.addEventListener('click', () => sidebar.classList.remove('open'));
</script>
</body>
</html>
